name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5" # verified latest during pre-flight

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cryostream/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_video_bucket_name: ${{ vars.VIDEO_BUCKET_NAME }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
